name: Build and deploy ASP.NET Core app to Azure Web App
on:
  push:
    branches:
      - main
env:
  AZURE_WEBAPP_NAME: SkillbridgeDW
  AZURE_WEBAPP_PACKAGE_PATH: './Skillbridge/published'
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'Skillbridge/Skillbridge/Skillbridge.csproj'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install npm packages
        working-directory: Skillbridge/Skillbridge
        run: npm ci

      - name: Build frontend
        working-directory: Skillbridge/Skillbridge
        run: npm run build
        
      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
